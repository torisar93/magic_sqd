org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Обход известного race condition в Gradle ("Current thread does not hold
# the state lock for root project") при параллельном разрешении конфигурации
# вместе с Kotlin-компиляцией — см. github.com/chaquo/chaquopy/issues/1342
# и github.com/gradle/gradle/issues/23917.
org.gradle.parallel=false
