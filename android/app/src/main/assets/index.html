<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic SQD</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/catalog-03.css" />
  <link rel="stylesheet" href="css/ui-lab.css" />
  <link rel="stylesheet" href="css/refinement05.css" />
  <link rel="stylesheet" href="css/usb06.css" />
  <link rel="stylesheet" href="css/ui07.css" />
  <link rel="stylesheet" href="css/icons07.css" />
  <link rel="stylesheet" href="css/ui08.css" />
  <link rel="stylesheet" href="css/progress08.css" />
  <link rel="stylesheet" href="css/stage_run.css" />
  <link rel="stylesheet" href="css/catalog09.css" />
  <link rel="stylesheet" href="css/catalog10.css" />
  <link rel="stylesheet" href="css/catalog11.css" />
  <link rel="stylesheet" href="css/catalog11-brands.css" />
  <link rel="stylesheet" href="css/instructions12.css" />
  <link rel="stylesheet" href="css/menus13.css" />
  <link rel="stylesheet" href="css/thanks.css" />
  <link rel="stylesheet" href="css/apps_tabs.css" />
</head>
<body>
  <div id="app">
    <div class="topbar">
      <button class="back" id="top-back" style="visibility: hidden">Назад</button>
      <span class="title" id="top-title">Magic SQD</span>
      <button id="top-log" class="header-log" type="button" aria-label="Лог и чат">Лог</button>
      <button class="help-btn account-btn" id="top-account" aria-label="Аккаунт" title="Аккаунт">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8.2" r="3.4"/><path d="M4.8 19.5c1.1-3.4 3.9-5.3 7.2-5.3s6.1 1.9 7.2 5.3"/></svg>
      </button>
      <button class="help-btn" id="top-help" aria-label="Настройки приложения" title="Настройки">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.7 3.7h4.6l.7 2.1c.5.2 1 .5 1.4.8l2.1-.4 2.3 4-1.4 1.6v1.6l1.4 1.6-2.3 4-2.1-.4c-.4.3-.9.6-1.4.8l-.7 2.1H9.7L9 19.4c-.5-.2-1-.5-1.4-.8l-2.1.4-2.3-4 1.4-1.6v-1.6L3.2 10l2.3-4 2.1.4c.4-.3.9-.6 1.4-.8l.7-2.1Z"/><circle cx="12" cy="12" r="3.1"/></svg>
      </button>
    </div>

    <div class="screen active cat-screen" id="screen-picker">
      <div class="cat-heading"><h1 id="cat-heading">Автомобили</h1><span id="cat-count"></span></div>
      <div class="catalog-actions" aria-label="Поиск и ссылки проекта">
        <label class="cat-search" for="picker-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="picker-search" type="search" autocomplete="off" placeholder="Поиск" />
        </label>
        <a class="catalog-link catalog-boosty" href="https://boosty.to/magic_sqd?locale=ru_RU" target="_blank" rel="noopener">Boosty</a>
        <a class="catalog-link" href="https://github.com/torisar93/magic_sqd" target="_blank" rel="noopener">GitHub</a>
      </div>
      <div class="cat-mobile-path"><div class="breadcrumb" id="picker-breadcrumb"></div><button id="cat-reset" type="button" hidden>Сбросить поиск</button></div>
      <div class="sync-status" id="picker-sync-status" style="display: none"></div>
      <main class="cat-grid" id="picker-list" aria-live="polite"></main>
      <div class="catalog-startup-overlay" id="catalog-startup-overlay" hidden>
        <div class="catalog-startup-progress">
          <div class="catalog-startup-spinner"></div>
          <strong>Обновляем каталог</strong>
          <span id="catalog-startup-progress-label">Подготавливаем список моделей…</span>
          <div class="catalog-startup-progress-track"><div id="catalog-startup-progress-fill"></div></div>
        </div>
      </div>
    </div>

    <div class="screen" id="screen-wizard">
      <div class="adb-bar" id="adb-bar">
        <div class="adb-mode-toggle" id="adb-mode-toggle" style="display: none">
          <button id="adb-mode-wired" class="accent">Провод</button>
          <button id="adb-mode-wifi">Wi-Fi</button>
        </div>
        <span id="adb-status">ADB: не подключено</span>
        <button id="adb-connect-btn">Подключить ADB</button>
      </div>
      <div class="adb-bar" id="usb-bar">
        <span id="usb-status">Флешка: не подключена</span>
        <button id="usb-connect-btn">Подключить флешку</button>
        <button id="usb-format-btn" class="danger">Форматировать</button>
      </div>
      <div id="wizard-content" style="flex: 1; overflow-y: auto"></div>
      <div class="log-bar" id="log-bar">
        <span id="log-last-line" class="log-last-line">Лог</span>
        <button id="log-expand-btn">▲</button>
      </div>
      <div class="log-overlay" id="log-overlay">
        <div class="log-card">
          <div class="log-card-header">
            <span>Лог</span>
            <div class="log-card-actions">
              <button id="log-copy-btn">Скопировать</button>
              <button id="log-collapse-btn">Свернуть ▼</button>
            </div>
          </div>
          <div class="log-panel" id="log-panel"></div>
          <div class="log-cmd-row">
            <div class="log-cmd-input-wrap">
              <input type="text" id="log-cmd-input" placeholder="Команда adb, вопрос ИИ по-русски или /ask на английском…" autocomplete="off" />
              <ul id="log-cmd-suggestions-list" class="log-cmd-suggestions-list" hidden></ul>
            </div>
            <button id="log-cmd-run" class="accent">▶</button>
          </div>
        </div>
      </div>
      <!-- Видео к этапу — плавающая кнопка над нижней панелью (см. app.js: renderNav, css: .video-fab);
           в самой панели для неё не хватало места на узких экранах и с длинной подписью. -->
      <button id="wizard-video" class="video-fab accent" type="button" hidden aria-label="Смотреть видео"></button>
      <div class="wizard-nav">
        <button id="wizard-back">Назад</button>
        <span class="page-label" id="wizard-page-label"></span>
        <button id="wizard-next" class="accent">Далее</button>
      </div>
    </div>
  </div>

  <script src="js/dom.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/icons07.js"></script>
  <script src="js/catalog09.js"></script>
  <script src="js/catalog-ui.js"></script>
  <script src="js/catalog11-brands.js"></script>
  <script src="js/instructions12.js"></script>
  <script src="js/refinement05.js"></script>
  <script src="js/progress08.js"></script>
  <script src="js/user_errors.js"></script>
  <script src="js/stage_run.js"></script>
  <script src="js/apps_tabs.js"></script>
  <script src="js/thanks.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui-lab.js"></script>
</body>
</html>
