name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller magic_sqd.spec

      - name: Собрать папку релиза (exe + cars/ + apk/ + tools/ + assets/)
        shell: pwsh
        run: |
          $out = "magic_sqd"
          New-Item -ItemType Directory -Path $out | Out-Null
          Copy-Item dist\magic_sqd.exe $out\
          Copy-Item -Recurse cars $out\cars
          Copy-Item -Recurse apk $out\apk
          Copy-Item -Recurse tools $out\tools
          Copy-Item -Recurse assets $out\assets
          Compress-Archive -Path "$out\*" -DestinationPath magic_sqd.zip

      - name: Опубликовать релиз на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: magic_sqd.zip
